<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI TestCase Generator</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<aside class="sb">
  <div class="logo">⚡ AI <span>TestCase</span> Generator</div>
  <nav class="nav" id="nav">
    <a data-view="input"><span class="num">1</span>Input</a>
    <a data-view="generate"><span class="num">2</span>Generate</a>
    <a data-view="review"><span class="num">3</span>Review</a>
    <a data-view="qtest"><span class="num">4</span>qTest Upload</a>
    <div class="sep"></div>
    <a data-view="setup"><span class="num">✓</span>Setup checklist</a>
    <a data-view="settings"><span class="num">⚙</span>Settings</a>
  </nav>
  <div class="runinfo" id="runinfo"></div>
</aside>
<div class="main">
  <div class="topbar">
    <button class="btn g sm" id="newRunBtn" title="Start a new run (clears current data)">＋ New run</button>
    <div class="user" id="userBtn"><span class="avatar">U</span>User ▾</div>
    <div class="menu" id="userMenu">
      <div data-go="settings">⚙ Settings</div>
      <div class="danger" id="logoutItem">↪ Log out</div>
    </div>
  </div>
  <div class="content" id="view"></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script src="/static/js/review.js"></script>
<script src="/static/js/excel_upload.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
